<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FIX HUB - Your Key</title>
<style>
body {
  background: #121216;
  color: #fff;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 40px;
}
h1 { color: #5AAAFF; }
.key {
  background: #1A1A20;
  border: 2px solid #5AAAFF;
  padding: 20px;
  font-size: 24px;
  font-family: monospace;
  border-radius: 10px;
  margin: 30px auto;
  max-width: 500px;
  word-break: break-all;
}
</style>
</head>
<body>
<h1>FIX HUB</h1>
<p>Your key has been generated!</p>
<div class="key" id="key">...</div>
<p>Copy the key above and paste it into the script.</p>
<script>
const params = new URLSearchParams(window.location.search);
const key = params.get('token') || 'No key generated';
document.getElementById('key').textContent = key;
</script>
</body>
</html>
